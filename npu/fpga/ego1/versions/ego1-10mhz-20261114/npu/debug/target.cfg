# Source after an adapter-specific cfg. No separate TRST/SRST top-level pins.
transport select jtag
adapter speed 10
reset_config none
jtag newtap mynpu cpu -irlen 5 -expected-id 0x00000001
target create mynpu.cpu riscv -chain-position mynpu.cpu -coreid 0
riscv set_command_timeout_sec 600
# SBA advertises aligned 32-bit access. Use aligned 32-bit memory transfers.
riscv set_mem_access sysbus progbuf
