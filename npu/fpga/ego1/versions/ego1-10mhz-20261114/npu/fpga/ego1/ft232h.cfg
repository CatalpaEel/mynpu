# Same external FT232H channel/pin mapping as the previous EGo1 board setup.
# AD0->J5 E15(TCK), AD1->E16(TDI), AD2<-D15(TDO), AD3->C15(TMS).
# Connect common ground. The FPGA configuration JTAG is a different chain.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0018 0x001b
# No external TRST/SRST connection is required by this design.
