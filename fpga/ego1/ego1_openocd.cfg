# Lab 6 OpenOCD template for the external FT232H JTAG adapter.
# Run in WSL after wiring TCK/TDI/TDO/TMS to J5 and attaching USB with usbipd.
adapter driver ftdi
transport select jtag
adapter speed 10
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00000001
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0
# Lab6 riscv-openocd uses grouped names; retain Ubuntu 0.12 compatibility.
if {[catch {gdb report_data_abort enable}]} { gdb_report_data_abort enable }
if {[catch {gdb report_register_access_error enable}]} { gdb_report_register_access_error enable }
riscv set_command_timeout_sec 120
riscv set_mem_access progbuf sysbus abstract
init
halt
source [find sba_helpers.tcl]
echo "Ready for Remote Connections (Lab6 JTAG, GDB :3333, Tcl :6666)"
