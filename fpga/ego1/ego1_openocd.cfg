# Lab 6 OpenOCD template for the external FT232H JTAG adapter.
# Run in WSL after wiring TCK/TDI/TDO/TMS to J5 and attaching USB with usbipd.
adapter driver ftdi
transport select jtag
adapter speed 10
ftdi vid_pid 0x0403 0x6014
ftdi channel 0
ftdi layout_init 0x0018 0x001b
ftdi layout_signal nTRST -ndata 0x0010

set _CHIPNAME riscv
jtag newtap $_CHIPNAME cpu -irlen 5
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0
gdb report_data_abort enable
gdb report_register_access_error enable
riscv set_command_timeout_sec 120
riscv set_mem_access progbuf sysbus abstract
init
halt