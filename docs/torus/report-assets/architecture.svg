<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="370" viewBox="0 0 1100 370"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#65758b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><rect x="30" y="55" width="230" height="100" rx="12" fill="#235ba8" fill-opacity=".07" stroke="#235ba8" stroke-width="2"/><text x="145.0" y="99.0" font-size="20" fill="#235ba8" text-anchor="middle">RISC-V CPU</text><text x="145.0" y="129.0" font-size="15" fill="#243248" text-anchor="middle">SRAM 中的软件循环 / 32bit 发令</text><rect x="430" y="30" width="270" height="100" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="565.0" y="74.0" font-size="20" fill="#087e8b" text-anchor="middle">4 × 4 PE torus</text><text x="565.0" y="104.0" font-size="15" fill="#243248" text-anchor="middle">4 × RF32 / PE；算术与量化</text><rect x="430" y="210" width="270" height="100" rx="12" fill="#235ba8" fill-opacity=".07" stroke="#235ba8" stroke-width="2"/><text x="565.0" y="254.0" font-size="20" fill="#235ba8" text-anchor="middle">流输入输出</text><text x="565.0" y="284.0" font-size="15" fill="#243248" text-anchor="middle">shape / stride / 预取 / 打包</text><rect x="850" y="125" width="220" height="130" rx="12" fill="#c57523" fill-opacity=".07" stroke="#c57523" stroke-width="2"/><text x="960.0" y="184.0" font-size="20" fill="#c57523" text-anchor="middle">共享 SRAM</text><text x="960.0" y="214.0" font-size="15" fill="#243248" text-anchor="middle">2 × 8KB 单端口宏</text><path d="M260,95 L425,80" stroke="#65758b" stroke-width="2" fill="none" marker-end="url(#a)" /><text x="340" y="61" font-size="16" fill="#243248" text-anchor="middle">32bit MMIO</text><path d="M260,125 L425,245" stroke="#65758b" stroke-width="2" fill="none" marker-end="url(#a)" /><text x="315" y="208" font-size="15" fill="#243248" text-anchor="middle">配置 / 发令</text><path d="M520,135 L520,205" stroke="#65758b" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><text x="615" y="175" font-size="15" fill="#243248" text-anchor="middle">本地寄存器数据</text><path d="M705,265 L845,210" stroke="#65758b" stroke-width="2" fill="none" marker-end="url(#a)" marker-start="url(#a)"/><text x="792" y="280" font-size="15" fill="#243248" text-anchor="middle">仲裁与缓存</text><path d="M145,55 V10 H960 V120" stroke="#65758b" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/><text x="805" y="75" font-size="15" fill="#243248" text-anchor="middle">CPU 取指 / 数据访问</text><text x="550" y="350" font-size="18" fill="#243248" text-anchor="middle">软件决定循环、依赖与算子组合；硬件保留握手、仲裁和地址发生控制。</text></g></svg>