<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#65758b"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="200" y="30" font-size="21" fill="#235ba8" text-anchor="middle">输入 2 × 14 × 14</text><text x="200" y="70" font-size="16" fill="#243248" text-anchor="middle">3 × 3 卷积，stride = 1，padding = 1</text><text x="200" y="110" font-size="17" fill="#243248" text-anchor="middle">每个输出：2 × 3 × 3 = 18 项 MAC</text><rect x="45" y="165" width="300" height="100" rx="12" fill="#235ba8" fill-opacity=".07" stroke="#235ba8" stroke-width="2"/><text x="195.0" y="209.0" font-size="20" fill="#235ba8" text-anchor="middle">激活 → R2</text><text x="195.0" y="239.0" font-size="15" fill="#243248" text-anchor="middle">每行一个空间位置，沿列广播</text><path d="M350,215 L435,215" stroke="#65758b" stroke-width="2" fill="none" marker-end="url(#a)" /><text x="687" y="27" font-size="20" fill="#087e8b" text-anchor="middle">列 = 4 个输出通道</text><rect x="445" y="55" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="505.0" y="88.5" font-size="20" fill="#087e8b" text-anchor="middle">p0 / c0</text><rect x="575" y="55" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="635.0" y="88.5" font-size="20" fill="#087e8b" text-anchor="middle">p0 / c1</text><rect x="705" y="55" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="765.0" y="88.5" font-size="20" fill="#087e8b" text-anchor="middle">p0 / c2</text><rect x="835" y="55" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="895.0" y="88.5" font-size="20" fill="#087e8b" text-anchor="middle">p0 / c3</text><rect x