=".07" stroke="#087e8b" stroke-width="2"/><text x="635.0" y="283.5" font-size="20" fill="#087e8b" text-anchor="middle">p3 / c1</text><rect x="705" y="250" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="765.0" y="283.5" font-size="20" fill="#087e8b" text-anchor="middle">p3 / c2</text><rect x="835" y="250" width="120" height="55" rx="12" fill="#087e8b" fill-opacity=".07" stroke="#087e8b" stroke-width="2"/><text x="895.0" y="283.5" font-size="20" fill="#087e8b" text-anchor="middle">p3 / c3</text><text x="690" y="340" font-size="18" fill="#243248" text-anchor="middle">行 = 同一输出行中相邻的 4 个位置</text><text x="200" y="320" font-size="16" fill="#243248" text-anchor="middle">权重 → R3：每列一个输出通道</text><text x="200" y="351" font-size="16" fill="#243248" text-anchor="middle">沿行广播；R0 累加，R1 存倍率</text><text x="550" y="383" font-size="18" fill="#243248" text-anchor="middle">全层输出 4 × 14 × 14 = 784B；56 个 tile，行尾 mask 屏蔽无效位置。</text></g></svg>